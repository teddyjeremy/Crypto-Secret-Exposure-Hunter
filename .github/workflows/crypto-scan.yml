name: Crypto secret exposure scan

on:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - ".gitleaks.toml"
      - ".github/workflows/crypto-scan.yml"
  workflow_dispatch:
    inputs:
      max_repos:
        description: Maximum public repositories to scan in this run
        required: false
        default: "80"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: crypto-secret-hunter-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ github.token }}
      INGEST_URL: https://crypto-secret-exposure-hunter.vercel.app/api/ingest
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      MAX_REPOS: ${{ inputs.max_repos || '80' }}
      PER_QUERY: "8"
      MAX_REPO_SIZE_KB: "50000"
      GITHUB_SEARCH_LIMIT: "30"
      REPO_TIMEOUT_SECONDS: "240"
    steps:
      - name: Checkout scanner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: "1.23.5"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.32.3
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate custom Gitleaks configuration
        run: |
          tmp="$(mktemp -d)"
          git init "$tmp"
          git -C "$tmp" config user.name "Scanner Test"
          git -C "$tmp" config user.email "scanner-test@example.invalid"
          printf "safe fixture\\n" > "$tmp/README.md"
          git -C "$tmp" add README.md
          git -C "$tmp" commit -m "empty scanner config fixture"
          gitleaks detect --source "$tmp" --config .gitleaks.toml --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks-config-check.json" --exit-code 0

      - name: Run scanner safety tests
        run: python -m unittest scanner.test_scan scanner.tests.test_classifier

      - name: Run public repository scan
        if: github.event_name != 'push'
        run: python scanner/scan.py
