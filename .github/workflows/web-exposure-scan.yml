name: Public website exposure scan

on:
  push:
    branches: [main]
    paths:
      - "scanner/web_scan.py"
      - "scanner/test_web_scan.py"
      - ".github/workflows/web-exposure-scan.yml"
  workflow_dispatch:
    inputs:
      max_sites:
        description: Maximum candidate websites to inspect
        required: false
        default: "1000"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: public-website-exposure-scan
  cancel-in-progress: false

jobs:
  passive-web-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WEB_MAX_SITES: ${{ inputs.max_sites || '1000' }}
      GITHUB_TOKEN: ${{ github.token }}
      WEB_MAX_ASSETS: "10"
      WEB_MAX_BYTES: "1500000"
      WEB_REQUEST_DELAY: "0.25"
      WEB_TIMEOUT_SECONDS: "8"
      WEB_CONCURRENCY: "20"
      WEB_INGEST_URL: "https://crypto-secret-exposure-hunter.vercel.app/api/web-ingest"
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests==2.32.3
      - name: Run safety tests
        run: python -m unittest scanner.test_web_scan
      - name: Run passive website scanner
        if: github.event_name != 'push'
        run: python scanner/web_scan.py
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: passive-website-scan-report
          path: web-scan-results.json
          if-no-files-found: ignore
          retention-days: 7
